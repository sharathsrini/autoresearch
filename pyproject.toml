[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous time series anomaly detection research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "requests>=2.32.0",
    "scikit-learn>=1.6.0",
    "torch>=2.2.0",
]

